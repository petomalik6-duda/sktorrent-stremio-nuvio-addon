name: Validate SKTorrent addon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Syntax check
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: Start addon
        run: |
          npm start > /tmp/sktorrent-addon.log 2>&1 &
          echo $! > /tmp/sktorrent-addon.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:7000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sktorrent-addon.log
          exit 1
      - name: HTTP stream contract probe
        run: |
          curl -fsS http://127.0.0.1:7000/debug/http-stream-contract > /tmp/http-stream.json
          node -e "const j=require('/tmp/http-stream.json');if(!j.ok||!j.torrentFallback||j.serverTorrentEngine||j.version!=='2.2.12')process.exit(1)"
      - name: Wako mode manifest probe
        run: |
          curl -fsS http://127.0.0.1:7000/wako/manifest.json > /tmp/wako-manifest.json
          node -e "const m=require('/tmp/wako-manifest.json');if(!m.id.endsWith('.wako')||!m.idPrefixes.includes('sktmovie')||m.version!=='2.2.12'||m.behaviorHints?.p2p===true)throw Error('Wako manifest contract')"
      - name: Wako direct bridge disabled safely without token
        run: |
          curl -fsS http://127.0.0.1:7000/debug/wako-direct > /tmp/wako-direct.json
          node -e "const j=require('/tmp/wako-direct.json');if(!j.ok||j.configured!==false||j.mode!=='server-side-torbox-direct-or-pending')throw Error('Wako direct bridge contract')"
      - name: Verify v2 movie source map
        run: |
          curl -fsS 'http://127.0.0.1:7000/debug/v2-sources/skt-posledne-filmy' > /tmp/sources.json
          node - <<'NODE'
          const j=require('/tmp/sources.json');
          if(!j.ok||!Array.isArray(j.categories)) throw new Error('invalid source map');
          if(j.categories.includes(0)) throw new Error('movie catalog must not scan category=0');
          for(const id of [1,5,14,15,20,31,3,43]) if(!j.categories.includes(id)) throw new Error(`missing movie category ${id}`);
          NODE
      - name: Concert playback probe
        continue-on-error: true
        run: curl -fsS --max-time 45 'http://127.0.0.1:7000/debug/playback/concert/The%20Cure'
