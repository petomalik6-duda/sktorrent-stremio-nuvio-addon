name: Validate SKTorrent addon

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Syntax check
        run: npm run check
      - name: Start addon
        run: |
          npm start > /tmp/sktorrent-addon.log 2>&1 &
          echo $! > /tmp/sktorrent-addon.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:7000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sktorrent-addon.log
          exit 1
      - name: Concert playback probe
        continue-on-error: true
        run: |
          curl -fsS --max-time 45 'http://127.0.0.1:7000/debug/playback/concert/The%20Cure' | tee /tmp/playback.json
          echo
          cat /tmp/sktorrent-addon.log
      - name: Guest magnet and infoHash probe
        continue-on-error: true
        run: |
          curl -fsSL --max-time 30 -A 'Mozilla/5.0' 'https://sktorrent.eu/torrent/torrents_v2.php?search=The%20Cure&category=26' -o /tmp/search.html
          ID=$(grep -oE 'details\.php\?id=[^"& ]+' /tmp/search.html | head -1 | sed 's/details.php?id=//')
          echo "torrent-id=$ID"
          test -n "$ID" || exit 0
          curl -fsSL --max-time 30 -A 'Mozilla/5.0' -e 'https://sktorrent.eu/' "https://sktorrent.eu/torrent/details.php?id=$ID" -o /tmp/detail.html
          echo '--- magnet candidates ---'
          grep -Eio 'magnet:\?[^"< ]+' /tmp/detail.html | head -5 || true
          echo '--- btih/hash candidates ---'
          grep -Eio '(btih:)?[A-Fa-f0-9]{40}' /tmp/detail.html | head -10 || true
          echo '--- download links ---'
          grep -Eio 'href="[^"]*(download\.php|magnet)[^"]*"' /tmp/detail.html | head -10 || true
